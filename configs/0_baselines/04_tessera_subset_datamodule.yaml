# Baseline: LightUNet on Tessera pixel embeddings, via Embed2HeightsDataModule.
# Same recipe as 03_alphaearth_subset_datamodule (region-grouped split, 2-epoch
# smoke run on data/subset/). Only the embedding source changes (128ch, pixel-aligned).
experiment_name: "04_tessera_subset_datamodule"
data_root: "data/subset"
embedding_source: "tessera"

model_name: "lightunet"
n_classes: 4
height_normalization_constant: 30.0

batch_size: 8
patch_size: 128
num_workers: 4
epochs: 40
learning_rate: 2.0e-4
weight_decay: 1.0e-4
val_split: 0.3
random_seed: 42

optimizer: "adam"
scheduler: "plateau"
patience: 10
factor: 0.1
