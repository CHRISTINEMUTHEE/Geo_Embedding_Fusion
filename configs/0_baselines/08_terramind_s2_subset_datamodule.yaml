# Baseline: EfficientDecoder on TerraMind Sentinel-2 patch-token embeddings.
# Optical counterpart of 07_terramind_s1_subset_datamodule. Same 16x16 tokens / 256x256
# labels, so EfficientDecoder not LightUNet. Smoke run on data/subset/.
experiment_name: "08_terramind_s2_subset_datamodule"
data_root: "data/subset"
embedding_source: "terramind_s2"

model_name: "efficientdecoder"
n_classes: 4
height_normalization_constant: 30.0

batch_size: 8
patch_size: 256
num_workers: 4
epochs: 2
learning_rate: 2.0e-4
weight_decay: 1.0e-4
val_split: 0.3
random_seed: 42

optimizer: "adam"
scheduler: "plateau"
patience: 10
factor: 0.1
