# Full-data baseline: EfficientDecoder on THOR Sentinel-2 patch-token embeddings.
# Optical counterpart of 11_thor_s1_datamodule.
experiment_name: "12_thor_s2_datamodule"
data_root: "data"
embedding_source: "thor_s2"

model_name: "efficientdecoder"
n_classes: 4
height_normalization_constant: 30.0

batch_size: 8
patch_size: 256
num_workers: 4
epochs: 30
learning_rate: 2.0e-4
weight_decay: 1.0e-4
val_split: 0.3
random_seed: 42

optimizer: "adam"
scheduler: "plateau"
patience: 10
factor: 0.1
